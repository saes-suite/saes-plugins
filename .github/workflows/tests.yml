name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Validate Plugin Manifests & Skills
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run CI pipeline
        run: make ci
